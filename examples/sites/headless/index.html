<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Headless Mode - Home</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0d0d0d; color: #00ff00; padding: 2rem; max-width: 800px; margin: 0 auto; }
        nav { border-bottom: 1px solid #333; padding-bottom: 1rem; margin-bottom: 2rem; display: flex; gap: 20px; align-items: center; }
        nav a { color: #fff; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        nav a:hover { color: #00ff00; text-decoration: underline; }
        .reset-btn { background: transparent; color: #ff3333; border: 1px solid #ff3333; font-size: 0.8rem; padding: 8px 16px; margin-left: auto; cursor: pointer; }
        .btn { background: #00ff00; color: #000; padding: 12px 24px; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; }
        .btn:hover { background: #fff; }
        .panel { border: 1px solid #333; background: #111; padding: 30px; margin-top: 20px; display: none; }
        .visible { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        pre { background: #000; padding: 10px; border: 1px solid #333; overflow-x: auto; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="shop/index.html">Shop</a>
        <button id="reset-btn" class="reset-btn">System Reset</button>
    </nav>

    <h1>💀 Headless Mode</h1>
    <p>Status: <span id="status-text">INITIALIZING...</span></p>
    <p>Will send metadata: <code id="page-meta-tag">(computing…)</code></p>

    <div id="ui-gate" class="panel">
        <h3 style="color: #fff">⛔ VERIFICATION REQUIRED</h3>
        <p>Please verify your age to access this site.</p>
        <button id="verify-btn" class="btn">VERIFY WITH AGEWALLET</button>
    </div>

    <div id="ui-content" class="panel">
        <h3 style="color: #fff">✅ IDENTITY CONFIRMED</h3>
        <p>Welcome back, User.</p>
        <p>Last verification metadata: <code id="last-meta">(none)</code></p>
        <div id="api-data">Loading secure data...</div>
    </div>

    <script type="module">
        import { AgeWallet } from '../../../src/index.js';

        const ROOT_URI = window.location.origin;

        const aw = new AgeWallet({
            clientId: import.meta.env.VITE_AW_HEADLESS_ID,
            mode: 'overlay',
            render: false,
            redirectUri: ROOT_URI,
            endpoints: {
                token: '/.netlify/functions/headless-token',
                userinfo: '/.netlify/functions/headless-userinfo'
            }
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
             if(confirm('Purge all session data?')) {
                localStorage.clear(); sessionStorage.clear();
                document.cookie.split(";").forEach((c) => document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/"));
                window.location.reload();
            }
        });

        // Distinctive per-page-load test payload so we can trace the round-trip on the backend
        const _ts = new Date().toISOString().slice(0, 16).replace(/[-:T]/g, '');
        const TEST_METADATA = `aw-test:js-sdk-headless:${_ts}`;
        document.getElementById('page-meta-tag').innerText = TEST_METADATA;

        document.getElementById('verify-btn').addEventListener('click', async () => {
            const auth = await aw.generateAuthUrl({ metadata: TEST_METADATA });
            window.location.href = auth.url;
        });

        async function run() {
            // If we landed here with ?code, init() will exchange it and redirect to the clean URL.
            // Don't continue past init() in that case — let the post-redirect page-load handle the
            // rest (otherwise we'd fire the secure-content fetch twice: once before the redirect,
            // once after, doubling the api.call billing for no benefit).
            const isCallback = new URLSearchParams(window.location.search).has('code');
            await aw.init();
            if (isCallback) return;

            const token = await aw.storage.getVerificationToken();

            if (token) {
                document.getElementById('status-text').innerText = "VERIFIED";
                document.getElementById('ui-content').classList.add('visible');
                const md = await aw.getMetadata();
                document.getElementById('last-meta').innerText = md ?? '(none)';
                try {
                    const res = await fetch('/.netlify/functions/headless-content', { headers: { 'Authorization': `Bearer ${token}` } });
                    const data = await res.json();
                    document.getElementById('api-data').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
                } catch(e) { document.getElementById('api-data').innerText = "API Error: " + e.message; }
            } else {
                document.getElementById('status-text').innerText = "WAITING FOR USER";
                document.getElementById('ui-gate').classList.add('visible');
            }
        }
        run();
    </script>
</body>
</html>
